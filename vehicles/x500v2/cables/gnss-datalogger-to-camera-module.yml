# GNSS/Datalogger to Camera Module
metadata:
  title: GNSS Datalogger to Camera Module
  description: Custom cable harness

options:
  bgcolor_node: "#FFFFFF"
  
connectors:
  X1: 
    type: JST GH
    subtype: female
    #bgcolor: '#F00000'
    pincount: 4
    pinlabels: [GND,
               PPS,
               NMEA,
               None]
    notes: "GNSS/DataLogger"
  X2:
    type: JST GH
    subtype: female
    pincount: 4
    pinlabels: [GND,
               PPS,
               NMEA,
               None]
    #image: 
    #   src: PHOTO.png
    #   width: 200
    notes: "Camera Module"

cables:
  W1:
    type: wire
    wirecount: 3
    gauge: 28 AWG
    length: 200 mm
    colors: [BK,OG,VT]
    wirelabels: []

connections:
  - - X1: [1-3]
    - W1: [1-3]
    - X2: [1-3]

