# TELEM3 to Camera Cable for HOT X500 drone
metadata:
  title: TELEM3 to Camera
  description: Custom cable harness

connectors:
  X1: 
    type: JST GH
    subtype: female
    pincount: 6
    pinlabels: [VCC,
                USART2_TX(out),
                USART2_RX(in),
                None (don't insert just pass through),
                None,
                GND]
    notes: "TELEM3 on Pixhawk"
  X2:
    type: JST XH
    subtype: female
    pincount: 4
    pinlabels: [GND,LED,RX,TX]
    notes: "Camera module" 
  X3:
    type: LED Board
    subtype: Direct solder
    pincount: 3
    pinlabels: [VCC, LED, GND]
    notes: "LED board"
cables:
  W1:
    type: wire
    wirecount: 3
    gauge: 28 AWG
    length: 250 mm
    colors: [OG, BU, YE]
    wirelabels: []
  W2:
    type: wire
    wirecount: 3
    gauge: 28 AWG
    length: 150 mm
    colors: [RD, OG, BK]
    wirelabels: []

connections:
  - - X1: [4,2-3]
    - W1: [1-3]
    - X2: [2,3,4]
      
  - - X1: [1,4,6]
    - W2: [1-3]
    - X3: [1-3]
